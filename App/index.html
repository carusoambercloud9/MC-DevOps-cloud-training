<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MaidCentral — Cleaning Management Platform</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: Arial, sans-serif; background: #0C1A2E; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; }
    .badge { background: #185FA5; color: #fff; padding: 6px 18px; border-radius: 20px; font-size: 12px; margin-bottom: 20px; letter-spacing: 1px; }
    h1 { font-size: 48px; color: #fff; margin-bottom: 10px; }
    h1 span { color: #1D9E75; }
    p { font-size: 18px; color: #B5D4F4; margin-bottom: 30px; }
    .status { background: #1D9E75; color: #fff; padding: 12px 32px; border-radius: 8px; font-size: 16px; }
    .info { margin-top: 40px; font-size: 13px; color: #5F5E5A; }
  </style>
</head>
<body>
  <div class="badge">🚀 DEPLOYED VIA ECS FARGATE</div>
  <h1>Maid<span>Central</span></h1>
  <p>Cleaning Management Platform — Production Ready</p>
  <div class="status">✅ Application Running</div>
  <div class="info">Containerized with Docker · Deployed on AWS ECS Fargate · CI/CD via GitHub Actions</div>
</body>
</html>
